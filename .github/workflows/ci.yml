name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devs = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return tuple(map(int, m.groups())) if m else (0, 0)
          for rt in sorted((r for r in devs if "iOS" in r), key=ver, reverse=True):
              phones = [d for d in devs[rt] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          test -n "$udid" || { echo "no iPhone simulator available"; xcrun simctl list devices available; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          xcodebuild build
          -project BaristaBrosiOS.xcodeproj
          -scheme BaristaBrosiOS
          -destination "id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO
      - name: Unit tests
        run: >
          xcodebuild test
          -project BaristaBrosiOS.xcodeproj
          -scheme BaristaBrosiOS
          -destination "id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO
